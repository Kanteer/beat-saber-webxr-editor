<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080d18">
  <title>Quest VR Beatmap Editor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <h1>QUEST BEATMAP EDITOR</h1>
    <p>Preparing your VR workspace…</p>
  </div>
  <div id="hud">
    <div class="brand">QUEST BEATMAP EDITOR</div>
    <div id="status">Starting editor…</div>
    <div class="hint">Use the VR button to enter. Point and press trigger to interact.</div>
  </div>
  <input id="audioPicker" type="file" accept="audio/*,.ogg,.mp3,.wav,.m4a">
  <input id="projectPicker" type="file" accept=".json,.bsmapproject.json,application/json">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
